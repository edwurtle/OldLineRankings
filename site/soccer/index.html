<!doctype html>
<!-- Soccer split into /boys-soccer/ and /girls-soccer/; send old /soccer/ links to the right one. -->
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Old Line Soccer Rankings</title>
<script>
  var h = location.hash || "";
  var girls = /^#\/girls\b/.test(h) || /[?&]g=girls\b/.test(h);
  location.replace((girls ? "../girls-soccer/" : "../boys-soccer/") + h.replace(/([?&])g=(boys|girls)&?/, "$1").replace(/[?&]$/, ""));
</script>
<meta http-equiv="refresh" content="0; url=../boys-soccer/">
</head><body><a href="../boys-soccer/">Boys soccer</a> · <a href="../girls-soccer/">Girls soccer</a></body></html>
