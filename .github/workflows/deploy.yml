name: Refresh results & deploy

on:
  schedule:
    # Off the top of the hour, when GitHub delays scheduled runs the most (UTC; Eastern is UTC-4 in
    # daylight time, UTC-5 in winter). The second run is a backup in case the first is delayed or skipped.
    - cron: "17 8 * * *"    # 4:17am EDT / 3:17am EST
    - cron: "47 10 * * *"   # 6:47am EDT / 5:47am EST
  workflow_dispatch:       # "Run workflow" button for an on-demand refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest results
        run: python scripts/build.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add site
          # Someone may push while this runs: retry on top of their commit (keeping this run's fresh data),
          # and never let saving the data stop the deploy below.
          git diff --cached --quiet || (git commit -m "Refresh results $(date -u +%F)" && \
            (git push || (git pull --rebase -X theirs origin main && git push) || echo "Could not save refreshed data; deploying anyway"))
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
